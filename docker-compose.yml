services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: twin_postgres
    environment:
      POSTGRES_USER: twin_user
      POSTGRES_PASSWORD: twin_password
      POSTGRES_DB: twin_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: twin_redis
    ports:
      - "6379:6379"

  node-backend:
    build: ./node-backend
    container_name: twin_node_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://twin_user:twin_password@postgres:5432/twin_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  fastapi-backend:
    build:
      context: .
      dockerfile: fastapi-backend/Dockerfile
    container_name: twin_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://twin_user:twin_password@postgres:5432/twin_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: twin_frontend
    ports:
      - "5173:5173"
    depends_on:
      - node-backend
      - fastapi-backend

  celery-worker:
    build:
      context: .
      dockerfile: fastapi-backend/Dockerfile
    container_name: twin_celery_worker
    command: celery -A worker.celery_app worker --loglevel=info --pool=solo
    environment:
      - DATABASE_URL=postgresql://twin_user:twin_password@postgres:5432/twin_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
